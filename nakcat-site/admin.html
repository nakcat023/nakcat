<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- หน้าเครื่องมือของแอดมิน: ไม่ให้ Google เก็บไปแสดงในผลค้นหา -->
    <meta name="robots" content="noindex, nofollow">
    <title>แอดมิน · nakcat</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><rect width=%27100%27 height=%27100%27 rx=%2728%27 fill=%27%23fbe3d2%27/><text x=%2750%27 y=%2770%27 font-size=%2762%27 text-anchor=%27middle%27>🐱</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=15">
    <style>
        /* สไตล์เฉพาะหน้าแอดมิน (ส่วนที่เหลือใช้ style.css ร่วมกับหน้าเว็บหลัก) */
        body { background: var(--warm); }
        .admin-wrap { max-width: 860px; padding-top: 48px; padding-bottom: 64px; }
        .admin-wrap h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 600; }
        .admin-sub { margin: 4px 0 28px; color: var(--muted); }
        .admin-card, .admin-story { padding: 22px 24px; border-radius: var(--radius); background: white; box-shadow: var(--shadow-sm); }
        .admin-card { display: grid; gap: 12px; max-width: 420px; }
        .admin-card label { display: grid; gap: 6px; }
        .admin-card input { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; font: inherit; }
        .admin-card input:focus { border-color: var(--orange); outline: none; box-shadow: 0 0 0 4px rgba(217, 109, 59, 0.15); }
        .admin-card .btn { justify-self: start; cursor: pointer; }
        .admin-card .btn::after, .admin-bar .btn::after { content: none; }
        .admin-login-msg { margin: 0; color: #9c2b22; font-weight: 500; }
        .admin-login-msg:empty { display: none; }
        .admin-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
        .admin-bar .btn { margin-left: auto; padding: 8px 16px; cursor: pointer; }
        .admin-msg { margin: 0 0 14px; color: var(--muted); }
        .admin-list { display: grid; gap: 14px; }
        .admin-story-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin: 0 0 10px; font-size: 0.9rem; }
        .admin-story-head strong { color: var(--orange-dark); font-size: 1rem; }
        .admin-story-head span { color: var(--muted); }
        .admin-story-text { margin: 0 0 16px; line-height: 1.8; white-space: pre-line; overflow-wrap: anywhere; }
        .admin-actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .admin-btn { padding: 9px 16px; border: 1.5px solid var(--line); border-radius: 999px; background: white; font: inherit; font-weight: 500; cursor: pointer; }
        .admin-btn.is-approve { border-color: #23663a; color: #23663a; }
        .admin-btn.is-approve:hover { color: white; background: #23663a; }
        .admin-btn.is-reject { border-color: #9c2b22; color: #9c2b22; }
        .admin-btn.is-reject:hover { color: white; background: #9c2b22; }
        .admin-btn:disabled { opacity: 0.5; cursor: wait; }
        .admin-edit { display: grid; gap: 12px; }
        .admin-edit label { display: grid; gap: 6px; font-size: 0.95rem; }
        .admin-edit input, .admin-edit textarea { padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; font: inherit; }
        .admin-edit textarea { min-height: 150px; resize: vertical; line-height: 1.7; }
        .admin-edit input:focus, .admin-edit textarea:focus { border-color: var(--orange); outline: none; box-shadow: 0 0 0 4px rgba(217, 109, 59, 0.15); }
        .admin-score { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
        .admin-score .admin-story-head { margin: 0; }
        a.admin-btn { display: inline-flex; align-items: center; color: inherit; text-decoration: none; }
        a.admin-btn.is-approve { color: #23663a; }
        a.admin-btn.is-approve:hover { color: white; }
        .admin-message.is-unread { box-shadow: inset 4px 0 0 var(--orange), var(--shadow-sm); }
        .admin-message .admin-story-head a { color: var(--orange-dark); }
        .tab-badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; margin-left: 6px; padding: 0 6px; border-radius: 999px; color: white; background: #9c2b22; font-size: 0.75rem; font-weight: 600; }
        .admin-tab.is-active .tab-badge { color: #9c2b22; background: white; }

        /* ===== แท็บภาพรวม (src/admin-dashboard.ts) ===== */
        .dash { display: grid; gap: 16px; }
        .dash-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
        .dash-tile { display: grid; gap: 2px; padding: 16px 18px; border: 0; border-radius: var(--radius); color: var(--ink); background: white; box-shadow: var(--shadow-sm); font: inherit; text-align: left; }
        .dash-tile.is-link { cursor: pointer; transition: transform 180ms ease, box-shadow 180ms ease; }
        .dash-tile.is-link:hover, .dash-tile.is-link:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--orange), var(--shadow-sm); transform: translateY(-2px); }
        .dash-tile-label { color: var(--muted); font-size: 0.85rem; }
        .dash-tile-value { font-size: 1.9rem; font-weight: 600; line-height: 1.2; }
        .dash-tile-sub { color: var(--muted); font-size: 0.8rem; }
        .dash-card { padding: 20px 22px; border-radius: var(--radius); background: white; box-shadow: var(--shadow-sm); min-width: 0; }
        .dash-title { margin: 0; font-size: 1.05rem; font-weight: 600; }
        .dash-note { margin: 2px 0 14px; color: var(--muted); font-size: 0.82rem; }
        .dash-pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }

        /* กราฟแท่งแนวตั้ง: แท่งบาง ปลายมน 4px ตั้งบนเส้นฐาน ห่างกัน 2px ขึ้นไป */
        .dash-cols { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; height: 180px; padding-top: 22px; border-bottom: 1px solid var(--line); }
        .dash-col { position: relative; display: flex; min-width: 0; height: 100%; outline: none; cursor: default; }
        .dash-col-track { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
        .dash-col-bar { width: min(100%, 22px); min-height: 0; border-radius: 4px 4px 0 0; background: #f0a47c; transition: background 150ms ease; }
        .dash-col.is-today .dash-col-bar { background: var(--orange); }
        .dash-col:hover .dash-col-bar, .dash-col:focus-visible .dash-col-bar { background: var(--orange-dark); }
        .dash-col-value { margin-bottom: 4px; color: var(--ink); font-size: 0.78rem; font-weight: 600; }
        .dash-col-day { position: absolute; top: calc(100% + 6px); right: 0; left: 0; color: var(--muted); font-size: 0.75rem; text-align: center; }
        .dash-col.is-today .dash-col-day { color: var(--ink); font-weight: 600; }
        /* ป้ายตัวเลขตอนชี้/แตะแท่ง: ซ่อนจริง (display: none) จนกว่าจะชี้ จะได้ไม่ดันหน้าให้กว้างเกินจอ
           7 วันแรกชิดซ้าย 7 วันหลังชิดขวา ป้ายจะไม่ล้นออกนอกกล่อง */
        .dash-col::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 4px); left: 0; z-index: 2; display: none; padding: 6px 10px; border-radius: 8px; color: white; background: var(--ink); font-size: 0.78rem; white-space: nowrap; pointer-events: none; }
        .dash-col:nth-child(n+8)::after { right: 0; left: auto; }
        .dash-col:hover::after, .dash-col:focus-visible::after { display: block; }
        .dash-card:has(.dash-cols) { padding-bottom: 36px; }

        /* กราฟแท่งแนวนอน: ชื่อ | แท่ง | ตัวเลข */
        .dash-bars { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
        .dash-bar-row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(60px, 1fr) auto; align-items: center; gap: 10px; font-size: 0.9rem; }
        .dash-bar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dash-bar-track { height: 10px; border-radius: 4px; background: var(--warm); }
        .dash-bar { display: block; height: 100%; border-radius: 4px; background: var(--orange); }
        .dash-bar-value { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
        .dash-bars.is-wrap .dash-bar-name { white-space: normal; line-height: 1.5; }

        .dash-table-wrap { overflow-x: auto; }
        .dash-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .dash-table th { padding: 8px 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 500; text-align: right; white-space: nowrap; }
        .dash-table td { padding: 9px 10px; border-bottom: 1px solid var(--warm); text-align: right; white-space: nowrap; }
        .dash-table th:first-child, .dash-table td:first-child { text-align: left; white-space: normal; }
        .dash-privacy { margin: 0; color: var(--muted); font-size: 0.82rem; line-height: 1.7; }
        .dash-empty { margin: 0; color: var(--muted); font-size: 0.88rem; }
        .dash-subs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
        .dash-sub { display: grid; align-content: start; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; }
        .dash-sub .admin-btn { justify-self: start; }
        .dash-sub .dash-note { margin: 0; }
        .dash-sub-title { margin: 0; font-size: 0.95rem; font-weight: 600; }
        .dash-sub-summary { margin: 0; font-size: 0.9rem; line-height: 1.7; }
        .dash-card > .dash-sub-summary { margin-top: 12px; color: var(--muted); }

        @media (max-width: 560px) {
            .dash-cols { gap: 3px; }
            .dash-col-value { font-size: 0.7rem; }
            .dash-pair { grid-template-columns: 1fr; }
        }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main class="container admin-wrap">
        <h1>✦ nakcat · แอดมิน</h1>
        <p class="admin-sub">ภาพรวมเว็บ ข้อความ ความเห็น เรื่องเล่า และกระดานคะแนน รวมไว้ที่เดียว</p>

        <form class="admin-card" id="admin-login">
            <label>รหัสแอดมิน
                <input type="password" id="admin-key" autocomplete="current-password" required>
            </label>
            <button type="submit" class="btn">เข้าสู่ระบบ</button>
            <p class="admin-login-msg" id="admin-login-msg" aria-live="polite"></p>
        </form>

        <section id="admin-panel" hidden>
            <div class="admin-bar" role="group" aria-label="เลือกหมวด">
                <button type="button" class="gallery-filter admin-tab is-active" data-status="Overview" aria-pressed="true">📊 ภาพรวม</button>
                <button type="button" class="gallery-filter admin-tab" data-status="Messages" aria-pressed="false">✉️ ข้อความ<span class="tab-badge" hidden></span></button>
                <button type="button" class="gallery-filter admin-tab" data-status="Comments" aria-pressed="false">💬 ความเห็น</button>
                <button type="button" class="gallery-filter admin-tab" data-status="Pending" aria-pressed="false">⏳ รอตรวจ<span class="tab-badge" hidden></span></button>
                <button type="button" class="gallery-filter admin-tab" data-status="Approved" aria-pressed="false">✅ อนุมัติแล้ว</button>
                <button type="button" class="gallery-filter admin-tab" data-status="Rejected" aria-pressed="false">❌ ไม่อนุมัติ</button>
                <button type="button" class="gallery-filter admin-tab" data-status="Scores" aria-pressed="false">🏆 กระดานจับคู่การ์ด</button>
                <button type="button" class="btn btn-ghost" id="admin-logout">ออกจากระบบ</button>
            </div>
            <p class="admin-msg" id="admin-msg" aria-live="polite"></p>
            <div class="admin-list" id="admin-list"></div>
        </section>
    </main>

    <script src="api.js"></script>
    <script src="admin-dashboard.js"></script>
    <script src="admin.js"></script>
</body>
</html>
